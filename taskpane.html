<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主題字型</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --ink: #1d1d1f;
    --ink2: rgba(0, 0, 0, .55);
    --glass: rgba(255, 255, 255, .42);
    --glass-in: rgba(255, 255, 255, .55);
    --glass-in-focus: rgba(255, 255, 255, .85);
    --rim: rgba(255, 255, 255, .78);
    --menu-bg: #fbfcff;
    --hover: rgba(10, 132, 255, .16);
    --accent: #0a84ff;
    --ok: #1b7f3b;
    --err: #c62828;
    --shadow: rgba(31, 38, 135, .14);
    --b1: #8ec0ff; --b2: #ffb7d5; --b3: #b8f0e0; --b4: #d9c7ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f7;
      --ink2: rgba(255, 255, 255, .62);
      --glass: rgba(38, 44, 66, .42);
      --glass-in: rgba(255, 255, 255, .10);
      --glass-in-focus: rgba(255, 255, 255, .18);
      --rim: rgba(255, 255, 255, .24);
      --menu-bg: #1e243a;
      --hover: rgba(10, 132, 255, .32);
      --ok: #5fd486;
      --err: #ff8a80;
      --shadow: rgba(0, 0, 0, .35);
      --b1: #1f3a8a; --b2: #6b2a63; --b3: #0f5662; --b4: #3b2a78;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang TC", "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--ink);
    background:
      radial-gradient(60% 40% at 15% 8%,  var(--b1) 0%, transparent 70%),
      radial-gradient(55% 40% at 90% 30%, var(--b2) 0%, transparent 70%),
      radial-gradient(60% 45% at 20% 75%, var(--b3) 0%, transparent 70%),
      radial-gradient(55% 40% at 85% 95%, var(--b4) 0%, transparent 70%),
      var(--b1);
    background-attachment: fixed;
    padding: 16px 14px 24px;
    -webkit-font-smoothing: antialiased;
  }
  h1 { margin: 2px 4px 2px; font-size: 20px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 0 4px 14px; color: var(--ink2); font-size: 11.5px; line-height: 1.5; }

  .card {
    position: relative;
    margin-bottom: 12px;
    padding: 14px 14px 12px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--rim);
    border-radius: 22px;
    box-shadow: 0 10px 30px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, .65),
                inset 0 -1px 0 rgba(255, 255, 255, .12);
  }
  .card::before {            /* 頂部高光 */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, .38), rgba(255, 255, 255, 0) 38%);
  }
  .card:focus-within { z-index: 20; }       /* 讓展開的選單蓋過下方卡片 */
  .card h2 { position: relative; margin: 0 0 10px; font-size: 13px; font-weight: 650; }
  .card h2 small { font-weight: 400; color: var(--ink2); margin-left: 6px; }

  .field { position: relative; margin-bottom: 9px; }
  .field:last-child { margin-bottom: 0; }
  .field > label { display: block; margin: 0 2px 4px; font-size: 11px; color: var(--ink2); }

  .combo { position: relative; }
  .combo input {
    width: 100%; padding: 8px 32px 8px 12px;
    font: inherit; color: var(--ink);
    background: var(--glass-in);
    border: 1px solid var(--rim);
    border-radius: 13px; outline: none;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .combo input:focus {
    background: var(--glass-in-focus);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, .22);
  }
  .combo .chev {
    position: absolute; right: 4px; top: 4px; width: 28px; height: 28px;
    border: 0; background: transparent; color: var(--ink2); cursor: pointer; border-radius: 9px;
  }
  .combo .chev:hover { background: var(--hover); }
  .menu {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    max-height: 230px; overflow-y: auto; margin: 0; padding: 5px; list-style: none;
    background: var(--menu-bg);   /* 巢狀 backdrop-filter 不會模糊下層卡片，改用近乎不透明底色確保可讀 */
    border: 1px solid var(--rim);
    border-radius: 16px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .22);
    z-index: 50;
  }
  .combo.open .menu { display: block; }
  .menu li {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 15px; line-height: 1.25;
  }
  .menu li.active, .menu li:hover { background: var(--hover); }
  .menu li .alt { font: 11px -apple-system, "PingFang TC", sans-serif; color: var(--ink2); white-space: nowrap; }
  .menu li.empty { color: var(--ink2); font: 12px -apple-system, "PingFang TC", sans-serif; cursor: default; }

  .opts { margin: 4px 4px 12px; display: grid; gap: 7px; }
  .opts label { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.4; cursor: pointer; }
  .opts input { margin-top: 2px; accent-color: var(--accent); }
  .opts .note { color: var(--ink2); font-size: 11px; }

  .btns { display: flex; gap: 8px; }
  button.btn {
    flex: 1; padding: 11px 14px; font: inherit; font-weight: 600; cursor: pointer;
    border-radius: 16px; color: var(--ink);
    background: var(--glass-in); border: 1px solid var(--rim);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    transition: transform .08s, background .15s, filter .15s;
  }
  button.btn:hover { background: var(--glass-in-focus); }
  button.btn:active { transform: scale(.98); }
  button.btn.primary {
    flex: 1.7; color: #fff; border-color: rgba(255, 255, 255, .6);
    background: linear-gradient(180deg, rgba(92, 170, 255, .98), rgba(10, 110, 235, .98));
    box-shadow: 0 6px 18px rgba(10, 110, 235, .38), inset 0 1px 0 rgba(255, 255, 255, .55);
  }
  button.btn.primary:hover { filter: brightness(1.07); }
  button.btn:disabled { opacity: .55; cursor: default; }

  #status {
    margin: 12px 4px 0; min-height: 18px; font-size: 12px; line-height: 1.5; white-space: pre-wrap;
  }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); } #status.busy { color: var(--ink2); }
  .foot { margin: 14px 4px 0; color: var(--ink2); font-size: 11px; line-height: 1.55; }

  @media (prefers-reduced-motion: no-preference) {
    body { animation: none; }
  }
</style>
</head>
<body>
  <h1>主題字型</h1>
  <p class="sub">修改此文件的佈景主題字型（Headings / Body），等同 Windows 的「自訂字型」。內文不會被改動。</p>

  <section class="card">
    <h2>標題 <small>Headings</small></h2>
    <div class="field" data-key="majorLatin"><label>英文字型 Latin</label></div>
    <div class="field" data-key="majorEa"><label>中文字型 East Asian</label></div>
  </section>

  <section class="card">
    <h2>內文 <small>Body</small></h2>
    <div class="field" data-key="minorLatin"><label>英文字型 Latin</label></div>
    <div class="field" data-key="minorEa"><label>中文字型 East Asian</label></div>
  </section>

  <div class="opts">
    <label><input type="checkbox" id="sync" checked><span>內文跟隨標題<br><span class="note">改標題字型時，內文同步更新</span></span></label>
    <label><input type="checkbox" id="backup"><span>套用前先在新視窗開啟原文件備份<br><span class="note">建議第一次使用時勾選</span></span></label>
  </div>

  <div class="btns">
    <button class="btn" id="read">讀取目前</button>
    <button class="btn primary" id="apply">套用到此文件</button>
  </div>
  <div id="status"></div>

  <p class="foot">字型欄位可直接輸入搜尋（例如 ming、hei、正黑、times）。<br>
    只有使用「主題字型」的文字會跟著改；被手動指定字型的文字，請全選後按 Ctrl + Space 清除。<br>
    可用 Cmd + Z 復原。</p>

<script src="vendor/jszip.min.js"></script>
<script src="core.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
